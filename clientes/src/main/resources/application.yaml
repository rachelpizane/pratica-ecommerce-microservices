server:
  port:
    8082

spring:
  application:
    name: clientes

  datasource:
    url: jdbc:postgresql://localhost:5432/icomprasclientes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true