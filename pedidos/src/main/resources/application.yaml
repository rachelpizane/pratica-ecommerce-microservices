server:
  port:
    8080

spring:
  application:
    name: pedidos

  datasource:
    url: jdbc:postgresql://localhost:5432/icompraspedidos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: 'http://localhost:29092'
    consumer:
      group-id: icompras-atualizacao-pedido
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: "atualizacao:edu.rachelpizane.icompras.pedidos.dto.AtualizacaoStatusPedidoDTO"
        spring.json.trusted.packages: "*"

icompras:
  pedidos:
    clients:
      produtos:
        url: 'http://localhost:8081/produtos'
      clientes:
        url: 'http://localhost:8082/clientes'
  config:
    kafka:
      server-url: 'http://localhost:29092'
      topics:
        pedidos-pagos: icompras.pedidos-pagos
        pedidos-faturados: icompras.pedidos-faturados
        pedidos-enviados: icompras.pedidos-enviados