server:
  port: 8081

spring:
  application:
    name: produtos

  datasource:
    url: jdbc:postgresql://localhost:5432/icomprasprodutos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true